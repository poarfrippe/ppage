<p>Gib mir deine Email Adresse :)
<form id="email-form">
  <input type="email" id="email-input" placeholder="you@example.com" style="width: 80%" required>
  <button type="submit" style="width: 15%">Subscribe</button>
</form>
<div id="email-status" class="email-status"></div>


<script>
document.getElementById('email-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const email = document.getElementById('email-input').value;
  const status = document.getElementById('email-status');

  status.classList.remove('show', 'success', 'error');

  try {
    const res = await fetch('/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    if (res.ok) {
      status.textContent = 'Kloppet!';
      status.classList.add('show', 'success');
      e.target.reset();
    } else {
      status.textContent = 'Hmm... Hat nicht funktioniert. Ach weißt du was, schreib mir einen Brief!';
      status.classList.add('show', 'error');
    }
  } catch (err) {
    status.textContent = 'Hmm... Hat nicht funktioniert. Ach weißt du was, schreib mir einen Brief!';
    status.classList.add('show', 'error');
  }
});
</script>

<style>
.email-form {
  display: flex;
  gap: 0.5rem;

.email-form input {
  flex: 1;

.email-status {
  margin-top: 0.6rem;

  font-weight: 500;
  font-size: 0.95rem;
  max-height: 0;

  opacity: 0;
  transition: all 0.25s ease;
}
.email-status.show {
  padding: 0.7rem 1rem;

  opacity: 1;
}
.email-status.success {
  background: #dcfce7;
  color: #166534;

}
.email-status.error {
  background: #fee2e2;
  color: #991b1b;

}
</style>
